name: brainz
services:
  db:
    image: postgres:${POSTGRES_MAJOR:-16}-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: company_manager
      POSTGRES_USER: brainz_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init-env.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U brainz_app -d company_manager']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: ../..
      dockerfile: deploy/rocky9/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: company_manager
      POSTGRES_USER: brainz_app
      DJANGO_DEBUG: 'false'
      DJANGO_BEHIND_PROXY: 'true'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/backend/staticfiles
      - ./assets:/app/assets:ro,Z
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  frontend:
    build:
      context: ../..
      dockerfile: deploy/rocky9/Dockerfile.frontend
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '${BIND_IP:?Set BIND_IP}:${HTTP_PORT:-8080}:80'
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - staticfiles:/srv/static:ro
volumes:
  pgdata:
  staticfiles:
